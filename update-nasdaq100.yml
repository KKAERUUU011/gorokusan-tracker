name: Update NASDAQ100

on:
  schedule:
    # 22:00 UTC ≈ 日本時間 朝7:00(米国市場のクローズ後)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch NASDAQ100 price
        env:
          API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set -e
          RESPONSE=$(curl -s "https://api.twelvedata.com/price?symbol=NDX&apikey=${API_KEY}")
          echo "Response: $RESPONSE"
          PRICE=$(echo "$RESPONSE" | grep -o '"price":"[^"]*"' | sed 's/"price":"//;s/"//')
          if [ -z "$PRICE" ]; then
            echo "価格の取得に失敗しました。APIレスポンスを確認してください。"
            exit 1
          fi
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"value\": $PRICE, \"updated_at\": \"$NOW\"}" > nasdaq100.json
          cat nasdaq100.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nasdaq100.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update NASDAQ100 price"
          git push
